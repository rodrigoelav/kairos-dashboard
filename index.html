<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Kairós Motores</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fundo de Mídia Dinâmica (Vídeos/Imagens) -->
    <div id="mediaBgContainer"></div>
    
    <!-- Background Animado (Canvas) -->
    <canvas id="bgCanvas"></canvas>
    <div id="bgOverlay"></div>

    <div class="app-container" id="appContainer">
        
        <!-- Cabeçalho (Oculto no Modo TV) -->
        <header class="top-bar">
            <div class="logo-area">
                <img src="LOGO PNG.png" alt="Kairós Motores" class="main-logo">
            </div>
            
            <div class="controls-area">
                <div class="slider-group">
                    <label for="blurSlider">Desfoque Fundo:</label>
                    <input type="range" id="blurSlider" min="0" max="20" value="5">
                </div>
                <div class="slider-group">
                    <label for="opacitySlider">Escurecimento:</label>
                    <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="0.7">
                </div>
                
                <button class="btn btn-primary" id="btnAddProject">
                    <i class="fa-solid fa-plus"></i> Novo Projeto
                </button>
                <div class="dropdown">
                    <button class="btn btn-secondary">
                        <i class="fa-solid fa-cog"></i>
                    </button>
                    <div class="dropdown-content">
                        <a href="#" id="btnExport"><i class="fa-solid fa-download"></i> Exportar Backup (JSON)</a>
                        <label for="importFile" class="import-label"><i class="fa-solid fa-upload"></i> Importar Backup</label>
                        <input type="file" id="importFile" accept=".json" style="display: none;">
                        <a href="#" id="btnTVMode"><i class="fa-solid fa-tv"></i> Modo Apresentação</a>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div class="section-title">
                <h2>PROJETOS EM ANDAMENTO</h2>
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar projeto ou responsável...">
                </div>
            </div>

            <div class="projects-grid" id="projectsGrid">
                <!-- Cartões serão injetados aqui via JavaScript -->
            </div>
        </main>
    </div>

    <!-- Modal Adicionar/Editar Projeto -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal-content glass-panel">
            <h2 id="modalTitle">Adicionar Projeto</h2>
            <form id="projectForm">
                <input type="hidden" id="projectId">
                
                <div class="form-group">
                    <label for="projName">Nome do Projeto</label>
                    <input type="text" id="projName" required placeholder="Ex: API Faturamento">
                </div>
                
                <div class="form-group">
                    <label for="projAssignees">Responsáveis</label>
                    <input type="text" id="projAssignees" required placeholder="Ex: Douglas e Pedro">
                </div>
                
                <div class="form-group">
                    <label for="projIcon">Ícone (FontAwesome class)</label>
                    <input type="text" id="projIcon" value="fa-solid fa-laptop-code" placeholder="Ex: fa-solid fa-chart-line">
                    <small>Consulte <a href="https://fontawesome.com/icons" target="_blank" style="color:var(--text-muted)">FontAwesome</a></small>
                </div>
                
                <div class="form-group">
                    <label for="projStatus">Status</label>
                    <select id="projStatus">
                        <option value="Em andamento">Em andamento</option>
                        <option value="Em análise">Em análise</option>
                        <option value="Parado">Parado</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="btnCancelModal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnDeleteProject" style="display: none;">Excluir</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
